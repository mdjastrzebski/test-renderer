name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  react-release-guard:
    name: Guard React Latest Support Window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup deps
        uses: ./.github/actions/setup

      - name: Check latest React release against supported line
        run: bun run check:react-release-guard

  test-react-versions:
    name: Test React ${{ matrix.react-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: ["~19.0.0", "~19.1.0", "~19.2.0", "~19.3.1", "latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup deps
        uses: ./.github/actions/setup

      - name: Install React ${{ matrix.react-version }}
        run: bun add -d react@${{ matrix.react-version }}

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:ci

  # Uses `@canary`, not `@next`: React's npm `next` tag is stale (stuck on a May 2026
  # 19.3.0 canary, older than stable 19.3.x), while `canary` tracks React's main
  # branch. `react` and `react-reconciler` must come from the same canary,
  # because a prerelease `react` doesn't satisfy the stable reconciler's peer range and
  # bun would install a second React copy.
  test-canary-react:
    name: Test React canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup deps
        uses: ./.github/actions/setup

      - name: Install React canary
        run: bun add -d react@canary

      - name: Install react-reconciler canary
        run: bun add react-reconciler@canary

      - name: Build with canary dependencies
        run: bun run build

      - name: Run tests with canary dependencies
        run: bun run test:ci
